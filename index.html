<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iustina & Kitty</title>
<style>
  :root { --bg:#2b2b36; --ui:#e8cfa6; --border:#4a3028; --text:#4a3028; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); font-family:'Courier New',Courier,monospace; min-height:100%; }
  body { display:flex; justify-content:center; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  #wrap { width:100%; max-width:820px; display:flex; flex-direction:column; }
  .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 10px;
         background:var(--ui); border-bottom:4px solid var(--border); padding:8px 10px; color:var(--text); font-weight:bold; font-size:12px; text-transform:uppercase; }
  .stat { display:flex; flex-direction:column; align-items:center; min-width:60px; }
  .bar { width:64px; height:9px; background:#000; border:2px solid var(--border); margin-top:3px; }
  .fill { height:100%; width:100%; transition:width .3s; }
  .hud { width:100%; display:flex; justify-content:space-between; font-size:12px; }
  #mute { cursor:pointer; }
  canvas { width:100%; display:block; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; background:#111; cursor:pointer; }
  .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; background:var(--ui); border-top:4px solid var(--border); }
  button { background:#fff; border:3px solid var(--border); color:var(--text); font-family:inherit; font-weight:bold;
           font-size:clamp(11px,3vw,15px); padding:10px 4px; cursor:pointer; box-shadow:2px 2px 0 var(--border); text-transform:uppercase; }
  button:active { transform:translate(2px,2px); box-shadow:none; }
  .hint { text-align:center; color:#cfc3a8; font-size:11px; padding:6px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="top">
    <div class="stat">Hunger<div class="bar"><div class="fill" id="b-hunger" style="background:#8f974a"></div></div></div>
    <div class="stat">Happy<div class="bar"><div class="fill" id="b-happy" style="background:#d95763"></div></div></div>
    <div class="stat">Energy<div class="bar"><div class="fill" id="b-energy" style="background:#5b6ee1"></div></div></div>
    <div class="stat">Clean<div class="bar"><div class="fill" id="b-clean" style="background:#5fcde4"></div></div></div>
    <div class="hud"><span>Bond Lv <span id="bond">1</span> &nbsp; Coins <span id="coins">0</span></span><span id="mute">[Mute]</span></div>
  </div>
  <canvas id="c" width="320" height="180"></canvas>
  <div class="controls">
    <button onclick="action('feed')">Feed</button>
    <button onclick="action('water')">Water</button>
    <button onclick="action('play')">Play</button>
    <button onclick="action('pet')">Pet</button>
    <button onclick="action('brush')">Brush</button>
    <button onclick="action('treat')">Treat</button>
    <button onclick="action('sleep')">Sleep</button>
    <button onclick="action('hold')">Pick Up</button>
    <button id="bed-btn" onclick="action('bed')">Bed</button>
  </div>
  <div class="hint">Tap Kitty to pet her. Tap the ground to walk Iustina there. Press Bed to tuck Iustina in and let Kitty cuddle.</div>
</div>

<script>
// ===== SETUP =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 320, H = 180, GROUND = 150, BED_X = 262;
const G = { time: 0, coins: 0, muted: false, particles: [], bubbles: [], bowl: null, toy: null, treats: 0, inBed: false };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const bondLevel = () => Math.floor(G.coins / 10) + 1;

// ===== AUDIO =====
let audioCtx = null;
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function sound(type) {
  if (G.muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  if (type === 'meow') {
    o.type = 'triangle';
    o.frequency.setValueAtTime(450, t);
    o.frequency.exponentialRampToValueAtTime(850, t + 0.18);
    o.frequency.exponentialRampToValueAtTime(380, t + 0.45);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18, t + 0.08); g.gain.linearRampToValueAtTime(0, t + 0.45);
    o.start(t); o.stop(t + 0.46);
  } else if (type === 'purr') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(40, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.08, t + 0.1); g.gain.linearRampToValueAtTime(0, t + 1.0);
    o.start(t); o.stop(t + 1.05);
  } else if (type === 'eat') {
    o.type = 'square'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.06);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.start(t); o.stop(t + 0.08);
  } else if (type === 'coin') {
    o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.07);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.2);
  } else {
    o.type = 'square'; o.frequency.setValueAtTime(800, t); o.frequency.exponentialRampToValueAtTime(200, t + 0.1);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.start(t); o.stop(t + 0.11);
  }
}
const muteEl = document.getElementById('mute');
muteEl.addEventListener('click', () => { G.muted = !G.muted; muteEl.textContent = G.muted ? '[Unmute]' : '[Mute]'; });

// ===== PIXEL SPRITES =====
const PAL = {
  S:'#f1c27d', H:'#9a4a2c', W:'#f4f1ee', J:'#8fb0dc', R:'#d95763', L:'#c0392b', T:'#999999', K:'#2b1d1a',
  C:'#e8cfa6', B:'#4a3028', E:'#5fcde4', D:'#d95763', F:'#c97b3d', O:'#1e1410', h:'#c46a3a'
};
const GIRL_HEAD = [
  ".....HHHHHH.....",
  "....HHhHHhHH....",
  "...HHSSSSSSHH...",
  "...HHSKSSKSHH...",
  "...HHSSSSSSHH...",
  "...HHSSLLSSHH...",
  "...HH.SSSS.HH..."
];
const SPR = {
  girl_idle: [...GIRL_HEAD,
    "...HWWWWWWWWH...",
    "..SHWWWWWWWWHS..",
    "..SWWWWWWWWWWS..",
    "..SWWWWWWWWWWT..",
    "...WWWWWWWWWW...",
    "....SSSSSSSS....",
    "....JJJJJJJJ....",
    "....JJJJJJJJ....",
    "....JJJJ.JJJ....",
    "....JJJJ.JJJ....",
    "....JJJJ.JJJ....",
    "....RRRR.RRR...."],
  girl_walk: [...GIRL_HEAD,
    "...HWWWWWWWWH...",
    "..SHWWWWWWWWHS..",
    "..SWWWWWWWWWWS..",
    "..SWWWWWWWWWWT..",
    "...WWWWWWWWWW...",
    "....SSSSSSSS....",
    "....JJJJJJJJ....",
    "...JJJJ....JJJ..",
    "..JJJJ......JJJ.",
    "..JJJ........JJ.",
    "..RRR.......RRR."],
  girl_crouch: [
    "................","................","................","................",
    ...GIRL_HEAD,
    "...HWWWWWWWWH...",
    "..SHWWWWWWWWHS..",
    "..SWWWWWWWWWWS..",
    "...WWWWWWWWWW...",
    "..JJJJJJJJJJJJ..",
    "..JJJJJJJJJJJJ..",
    "..JJJJJJJJJJJJ..",
    "..RRR......RRR.."],
  girl_lie: [
    ".HHHH...................",
    "HHHSSHH.................",
    "HHSKSLHWWWWWWWWJJJJJJJ..",
    "HHSSSSHWWWWWWWWJJJJJJJRR",
    ".HHH..WWWWWWWWJJJJJJJ...",
    "......SSSSSS............"],
  cat_sit: [
    "..BB......BB..",
    "..BBB....BBB..",
    "..BBBBBBBBBB..",
    ".BBBBBBBBBBBB.",
    ".BBEBBBBBBEBB.",
    ".BBBBBBDBBBBB.",
    "..BBBBBBBBBB..",
    "...CCCCCCCC...",
    "..CCCCCCCCCC..",
    ".CCCCCCCCCCCC.",
    ".CCCCCCCCCCCC.",
    "..CCCCCCCCCC..",
    "..BBBB....BBBB"],
  cat_beg: [
    "..BB......BB..",
    "..BBB....BBB..",
    "..BBBBBBBBBB..",
    ".BBBBBBBBBBBB.",
    ".BBEBBBBBBEBB.",
    ".BBBBBBDBBBBB.",
    "..BBBBBBBBBB..",
    "...CCCCCCCC...",
    ".BCCCCCCCCCCB.",
    "BBCCCCCCCCCCBB",
    "B.CCCCCCCCCC.B",
    "..CCCCCCCCCC..",
    "..BBBB....BBBB"],
  cat_walk1: [
    "BB............B...",
    "BBB...........BB..",
    ".BCEBCCCCCCCBB....",
    ".BCCBCCCCCCCCCBB..",
    "BCCCCCCCCCCCCCCCB.",
    "BCCCCCCCCCCCCCCCBB",
    ".BCCCCCCCCCCCCCB..",
    "..BB.BB....BB.BB..",
    "..BB.BB....BB.BB.."],
  cat_walk2: [
    "BB............B...",
    "BBB...........BB..",
    ".BCEBCCCCCCCBB....",
    ".BCCBCCCCCCCCCBB..",
    "BCCCCCCCCCCCCCCCB.",
    "BCCCCCCCCCCCCCCCBB",
    ".BCCCCCCCCCCCCCB..",
    "...B.B.....B.B....",
    "..B..B.....B..B..."],
  cat_sleep: [
    "....BBBBBBBB....",
    "..BBCCCCCCCBB...",
    ".BCCCCCCCCCCCBB.",
    "BCCCCCCCCCCCCCCBB",
    "BBBBBBBBBBBBBBBBB"],
  bowl: ["BBBBBBBB", "BFFFFFFB", ".BBBBBB."],
  toy: [".DDD.", "DDLDD", "DLDDD", "DDDLD", ".DDD."]
};
// Adds a 1-cell dark outline (and transparent border) around a sprite grid.
function outlineRows(raw) {
  const W0 = Math.max(...raw.map(r => r.length));
  const pad = '.'.repeat(W0 + 2);
  const g = [pad, ...raw.map(r => '.' + r.padEnd(W0, '.') + '.'), pad];
  const H = g.length, W = W0 + 2;
  return g.map((row, y) => row.split('').map((ch, x) => {
    if (ch !== '.') return ch;
    const hit = [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dx, dy]) => {
      const yy = y + dy, xx = x + dx;
      return yy >= 0 && yy < H && xx >= 0 && xx < W && g[yy][xx] !== '.';
    });
    return hit ? 'O' : '.';
  }).join(''));
}
const SC = 3; // screen pixels per sprite cell
const Sprites = {};
(function compile() {
  const sc = SC;
  for (const [name, raw] of Object.entries(SPR)) {
    const rows = /^(cat|girl)/.test(name) ? outlineRows(raw) : raw;
    const w = Math.max(...rows.map(r => r.length)), h = rows.length;
    const c = document.createElement('canvas'); c.width = w * sc; c.height = h * sc;
    const x = c.getContext('2d');
    rows.forEach((row, yy) => { for (let xx = 0; xx < w; xx++) {
      const ch = row[xx]; if (ch && ch !== '.') { x.fillStyle = PAL[ch] || '#ff00ff'; x.fillRect(xx * sc, yy * sc, sc, sc); }
    }});
    const f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
    const fx = f.getContext('2d'); fx.translate(f.width, 0); fx.scale(-1, 1); fx.drawImage(c, 0, 0);
    Sprites[name] = c; Sprites[name + '_flip'] = f;
  }
})();

// ===== BACKGROUND (pre-rendered) =====
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const stars = [];
(function buildBG() {
  const b = bg.getContext('2d');
  const sky = ['#0d0d1f', '#12122a', '#171736', '#1d1d42', '#242450', '#2c2c5c'];
  sky.forEach((c, i) => { b.fillStyle = c; b.fillRect(0, i * 18, W, 19); });
  for (let i = 0; i < 40; i++) stars.push({ x: Math.random() * W, y: Math.random() * 90, p: Math.random() * 6 });
  // moon (pixel circle)
  b.fillStyle = '#f3ecd0';
  for (let dy = -9; dy <= 9; dy++) for (let dx = -9; dx <= 9; dx++) if (dx * dx + dy * dy <= 81) b.fillRect(262 + dx, 30 + dy, 1, 1);
  b.fillStyle = '#d8cfae'; b.fillRect(257, 27, 3, 3); b.fillRect(266, 34, 2, 2);
  // hills
  b.fillStyle = '#16203a';
  for (let x = 0; x < W; x++) b.fillRect(x, 100 + Math.sin(x / 38) * 8 + Math.sin(x / 13) * 2, 1, 40);
  // trees
  const tree = (tx, th) => { b.fillStyle = '#0b1424'; b.fillRect(tx, 112 - th, 5, th + 8);
    for (let r = 0; r < 5; r++) b.fillRect(tx - 12 + r * 2, 112 - th - 14 + r * 4, 29 - r * 4, 6); };
  tree(18, 20); tree(64, 14); tree(236, 22); tree(292, 16);
  // grass
  b.fillStyle = '#1f3b2a'; b.fillRect(0, 118, W, H - 118);
  b.fillStyle = '#26492f'; b.fillRect(0, 118, W, 3);
  for (let i = 0; i < 260; i++) {
    const x = Math.floor(Math.random() * W), y = 122 + Math.floor(Math.random() * (H - 122));
    b.fillStyle = Math.random() < 0.5 ? '#2d5a39' : '#183122'; b.fillRect(x, y, 1, 2);
  }
  for (let i = 0; i < 14; i++) { b.fillStyle = ['#e8cfa6', '#d95763', '#e9a8c9'][i % 3]; b.fillRect(Math.floor(Math.random() * W), 126 + Math.floor(Math.random() * 50), 2, 2); }
  for (let i = 0; i < 8; i++) { b.fillStyle = '#b8782b'; b.fillRect(Math.floor(Math.random() * W), 130 + Math.floor(Math.random() * 45), 3, 2); }
  // fence
  b.fillStyle = '#3a2a22';
  for (let x = 0; x < W; x += 12) b.fillRect(x, 106, 4, 18);
  b.fillRect(0, 111, W, 2); b.fillRect(0, 118, W, 2);
})();

// ===== ENTITIES =====
const Iustina = {
  x: 80, y: GROUND, dir: 1, state: 'idle', timer: 0, targetX: null, cb: null, busy: false,
  goTo(x, cb) { this.targetX = clamp(x, 18, W - 18); this.cb = cb || null; this.state = 'walk'; },
  crouchFor(ms, then) { this.state = 'crouch'; setTimeout(() => { this.state = 'idle'; if (then) then(); }, ms); },
  update() {
    this.timer++;
    if (this.state === 'walk') {
      const dx = this.targetX - this.x;
      if (Math.abs(dx) > 1.2) { this.dir = dx > 0 ? 1 : -1; this.x += this.dir * 1.1; }
      else { this.state = 'idle'; const f = this.cb; this.cb = null; if (f) f(); }
    }
  },
  draw() {
    if (this.state === 'lie') {
      const s = Sprites.girl_lie;
      ctx.drawImage(s, BED_X - 30, GROUND - 8 - s.height + ((Math.floor(this.timer / 50) % 2) ? 1 : 0));
      return;
    }
    let n = 'girl_idle';
    if (this.state === 'walk') n = (Math.floor(this.timer / 10) % 2) ? 'girl_walk' : 'girl_idle';
    else if (this.state === 'crouch') n = 'girl_crouch';
    const s = Sprites[n + (this.dir === -1 ? '_flip' : '')];
    const bob = (this.state === 'idle' && Math.floor(this.timer / 40) % 2) ? 1 : 0;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.floor(this.x - 12), this.y, 24, 3);
    ctx.drawImage(s, Math.floor(this.x - s.width / 2), this.y - s.height + bob);
  }
};

// Accessories are placed in padded sprite-grid cells (SC screen px per cell).
const ACC = {
  cat_sit: { bow: [[5, 8], [6, 8]], bell: [[8, 9]] },
  cat_beg: { bow: [[5, 8], [6, 8]], bell: [[8, 9]] }
};
function drawCat(name, flip, x, y) {
  const s = Sprites[name + (flip ? '_flip' : '')];
  const dx = Math.floor(x - s.width / 2), dy = Math.floor(y - s.height);
  ctx.drawImage(s, dx, dy);
  const a = ACC[name];
  if (a) {
    const Wc = s.width / SC;
    const cell = (c, r, col) => { const cc = flip ? Wc - 1 - c : c; ctx.fillStyle = col; ctx.fillRect(dx + cc * SC, dy + r * SC, SC, SC); };
    if (bondLevel() >= 2) a.bow.forEach(([c, r]) => cell(c, r, '#e8606c'));
    if (bondLevel() >= 3) a.bell.forEach(([c, r]) => cell(c, r, '#f4c430'));
  }
  return s;
}

const Kitty = {
  x: 170, y: GROUND + 4, dir: -1, state: 'idle', timer: 0, stateT: 0, freeze: 0,
  stats: { hunger: 60, happy: 60, energy: 90, clean: 90 },
  setState(s) { this.state = s; this.stateT = 0; },
  update() {
    this.timer++; this.stateT++;
    const st = this.stats;
    if (this.timer % 60 === 0) {
      st.hunger = clamp(st.hunger - 0.4, 0, 100);
      st.clean = clamp(st.clean - 0.1, 0, 100);
      st.happy = clamp(st.happy - (st.hunger < 20 ? 0.5 : 0.2), 0, 100);
      if (this.state !== 'sleep' && this.state !== 'cuddle') st.energy = clamp(st.energy - 0.25, 0, 100);
      if (G.treats > 0 && this.timer % 3600 === 0) G.treats--;
      updateUI(); save();
    }
    if (this.state === 'held') {
      this.x = Iustina.x + Iustina.dir * 9; this.y = Iustina.y - 8;
      if (this.timer % 60 === 0) st.happy = clamp(st.happy + 0.6, 0, 100);
      return;
    }
    if (this.state === 'cuddle') {
      this.x = BED_X - 8; this.y = GROUND - 9;
      if (this.stateT % 60 === 0) {
        st.energy = clamp(st.energy + 3, 0, 100); st.happy = clamp(st.happy + 1, 0, 100); updateUI();
        const z = this.stateT % 120 === 0;
        particle(z ? 'Zzz' : '♥', this.x + 8, this.y - 14, z ? '#cfd8ff' : '#ff6f91');
        if (this.stateT % 240 === 0) sound('purr');
      }
      return;
    }
    if (this.state === 'toBed') {
      const dx = (BED_X - 46) - this.x;
      if (Math.abs(dx) > 3) { this.dir = dx > 0 ? 1 : -1; this.x += this.dir * 1.6; }
      else { this.hopFromX = this.x; this.setState('hop'); }
      this.y = GROUND + 4; return;
    }
    if (this.state === 'hop') {
      const t = Math.min(1, this.stateT / 40);
      this.dir = 1;
      this.x = this.hopFromX + (BED_X - 8 - this.hopFromX) * t;
      this.y = (GROUND + 4) + ((GROUND - 9) - (GROUND + 4)) * t - Math.sin(Math.PI * t) * 18;
      if (t >= 1) { this.setState('cuddle'); sound('purr'); particle('♥', this.x, this.y - 16, '#ff6f91'); bubble('Purr...', this.x, this.y - 36); }
      return;
    }
    this.y = GROUND + 4;
    if (this.state === 'wait') return;

    if (this.state === 'petted') { if (this.stateT > this.freeze) this.setState('idle'); return; }

    if (this.state === 'idle') {
      if (G.toy && st.energy > 8) { this.setState('walk'); return; }
      if (G.bowl && st.hunger < 97) { this.setState('walk'); return; }
      if (st.energy < 20) { this.setState('sleep'); return; }
      if (st.hunger < 30 && Math.random() < 0.006) { bubble('Feed me!', this.x, this.y - 34); sound('meow'); this.setState('beg'); return; }
      if (st.happy < 25 && Math.random() < 0.004) { bubble('mrrp...', this.x, this.y - 34); }
      if (Math.random() < 0.012) { this.setState('walk'); this.dir = Math.random() < 0.5 ? 1 : -1; this.stateT = 0; }
    }
    else if (this.state === 'beg') { if (this.stateT > 120) this.setState('idle'); }
    else if (this.state === 'walk') {
      const target = G.toy ? G.toy : G.bowl;
      if (target) {
        const dx = target.x - this.x;
        if (Math.abs(dx) > 6) { this.dir = dx > 0 ? 1 : -1; this.x += this.dir * (G.toy ? 1.5 : 1.0); }
        else if (G.toy) { this.setState('play'); }
        else { this.setState('eat'); }
      } else {
        this.x += this.dir * 0.5;
        if (this.x < 20 || this.x > W - 20 || this.stateT > 90 + Math.random() * 100) this.setState('idle');
      }
    }
    else if (this.state === 'eat') {
      if (!G.bowl) { this.setState('idle'); return; }
      if (this.stateT % 30 === 0) {
        st.hunger = clamp(st.hunger + 8, 0, 100); sound('eat'); updateUI();
        if (st.hunger >= 100 || this.stateT > 420) {
          G.bowl = null; this.setState('idle'); bubble('Purr...', this.x, this.y - 34); sound('purr'); addCoins(1);
        }
      }
    }
    else if (this.state === 'play') {
      if (!G.toy) { this.setState('idle'); return; }
      G.toy.x += Math.sin(this.stateT / 8) * 1.2; G.toy.x = clamp(G.toy.x, 20, W - 20);
      if (this.stateT % 15 === 0) {
        st.happy = clamp(st.happy + 2, 0, 100); st.energy = clamp(st.energy - 1.2, 0, 100); updateUI();
        if (this.stateT % 60 === 0) particle('\u2665', this.x, this.y - 30, '#d95763');
      }
      if (this.stateT > 600 || st.energy < 10) { G.toy = null; this.setState('idle'); bubble('Fun!', this.x, this.y - 34); addCoins(2); }
    }
    else if (this.state === 'sleep') {
      if (this.stateT % 60 === 0) {
        st.energy = clamp(st.energy + 4, 0, 100); particle('Zzz', this.x + 8, this.y - 16, '#cfd8ff'); updateUI();
        if (st.energy >= 100) this.setState('idle');
      }
    }
    this.x = clamp(this.x, 14, W - 14);
  },
  draw() {
    let n = 'cat_sit', bob = 0;
    const flip = this.dir === -1;
    if (this.state === 'walk') n = (Math.floor(this.timer / 9) % 2) ? 'cat_walk1' : 'cat_walk2';
    else if (this.state === 'sleep') { n = 'cat_sleep'; bob = (Math.floor(this.timer / 35) % 2) ? 1 : 0; }
    else if (this.state === 'eat') bob = (Math.floor(this.timer / 10) % 2) ? 2 : 0;
    else if (this.state === 'play') { n = 'cat_beg'; bob = -Math.abs(Math.sin(this.timer / 6)) * 5; }
    else if (this.state === 'beg') { n = 'cat_beg'; bob = (Math.floor(this.timer / 15) % 2) ? 1 : 0; }
    else if (this.state === 'toBed') n = (Math.floor(this.timer / 9) % 2) ? 'cat_walk1' : 'cat_walk2';
    else if (this.state === 'hop') n = 'cat_beg';
    else if (this.state === 'cuddle') { n = 'cat_sleep'; bob = (Math.floor(this.timer / 40) % 2) ? 1 : 0; }
    if (this.state !== 'cuddle' && this.state !== 'hop') { ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.floor(this.x - 10), GROUND + 4, 20, 2); }
    const s = drawCat(n, flip, this.x, this.y + bob);
    // name tag
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(Math.floor(this.x - 14), Math.floor(this.y - s.height - 13), 28, 10);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 8px "Courier New",monospace'; ctx.textAlign = 'center';
    ctx.fillText('Kitty', Math.floor(this.x), Math.floor(this.y - s.height - 5));
  }
};

// ===== EFFECTS =====
function particle(text, x, y, color) { G.particles.push({ text, x, y, life: 70, color: color || '#fff' }); }
function bubble(text, x, y) { G.bubbles.push({ text, x, y, life: 110 }); }
function addCoins(n) {
  const before = bondLevel(); G.coins += n; sound('coin');
  if (bondLevel() > before) { bubble('Bond level up!', Kitty.x, Kitty.y - 44); particle('\u2605', Kitty.x, Kitty.y - 30, '#f4c430'); }
  updateUI();
}
function updateUI() {
  const s = Kitty.stats;
  document.getElementById('b-hunger').style.width = s.hunger + '%';
  document.getElementById('b-happy').style.width = s.happy + '%';
  document.getElementById('b-energy').style.width = s.energy + '%';
  document.getElementById('b-clean').style.width = s.clean + '%';
  document.getElementById('coins').textContent = G.coins;
  document.getElementById('bond').textContent = bondLevel();
}
function save() { try { localStorage.setItem('iustina_kitty_v2', JSON.stringify({ stats: Kitty.stats, coins: G.coins, treats: G.treats })); } catch (e) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('iustina_kitty_v2') || 'null');
    if (d) { Object.assign(Kitty.stats, d.stats); G.coins = d.coins || 0; G.treats = d.treats || 0; }
  } catch (e) {}
  updateUI();
}

// ===== ACTIONS =====
function startTask() { if (Iustina.busy || Kitty.state === 'held') return false; Iustina.busy = true; return true; }
function endTask() { Iustina.busy = false; }
function sideOf(x) { return Iustina.x <= x ? -1 : 1; } // which side of x Iustina stands on

window.action = function (type) {
  ac(); sound('click');
  const st = Kitty.stats;
  if (Kitty.state === 'held' && type !== 'hold' && type !== 'pet') { bubble('Put Kitty down first', Iustina.x, Iustina.y - 50); return; }
  if (G.inBed && type !== 'bed' && type !== 'pet') { bubble('Get up first!', BED_X - 6, GROUND - 40); return; }
  switch (type) {
    case 'feed': {
      if (st.hunger >= 95) { bubble('Not hungry', Kitty.x, Kitty.y - 34); return; }
      if (!startTask()) return;
      const bx = clamp(Math.round(60 + Math.random() * 200), 40, W - 40);
      Iustina.goTo(bx - 22, () => {
        Iustina.dir = 1;
        Iustina.crouchFor(700, () => { G.bowl = { x: bx }; if (Kitty.state === 'sleep') Kitty.setState('idle'); endTask(); });
      });
      break; }
    case 'water':
      st.hunger = clamp(st.hunger + 4, 0, 100); st.energy = clamp(st.energy + 3, 0, 100); st.happy = clamp(st.happy + 2, 0, 100);
      bubble('Slurp!', Kitty.x, Kitty.y - 34); sound('eat'); addCoins(1); break;
    case 'play': {
      if (st.energy < 15) { bubble('Too sleepy...', Kitty.x, Kitty.y - 34); return; }
      if (G.toy || !startTask()) return;
      const tx = clamp(Math.round(60 + Math.random() * 200), 40, W - 40);
      Iustina.goTo(tx - 24, () => {
        Iustina.dir = 1;
        Iustina.crouchFor(400, () => { G.toy = { x: tx }; if (Kitty.state === 'sleep') Kitty.setState('idle'); endTask(); });
      });
      break; }
    case 'pet': {
      if (G.inBed) {
        if (Kitty.state === 'cuddle') { particle('♥', Kitty.x, Kitty.y - 18, '#ff6f91'); st.happy = clamp(st.happy + 2, 0, 100); sound('purr'); updateUI(); }
        return;
      }
      if (Kitty.state === 'held') { particle('\u2665', Kitty.x, Kitty.y - 24, '#ff6f91'); st.happy = clamp(st.happy + 2, 0, 100); sound('purr'); updateUI(); return; }
      if (!startTask()) return;
      Kitty.setState('wait');
      Iustina.goTo(Kitty.x + sideOf(Kitty.x) * 24, () => {
        Iustina.dir = Kitty.x > Iustina.x ? 1 : -1;
        Iustina.state = 'crouch'; sound('purr');
        let n = 0; const iv = setInterval(() => { particle('\u2665', Kitty.x + (Math.random() * 14 - 7), Kitty.y - 26, '#ff6f91'); if (++n >= 4) clearInterval(iv); }, 300);
        setTimeout(() => {
          Iustina.state = 'idle'; st.happy = clamp(st.happy + 7, 0, 100); Kitty.freeze = 90; Kitty.setState('petted');
          bubble('Purr~', Kitty.x, Kitty.y - 36); addCoins(1); endTask();
        }, 1300);
      });
      break; }
    case 'brush': {
      if (!startTask()) return;
      Kitty.setState('wait');
      Iustina.goTo(Kitty.x + sideOf(Kitty.x) * 24, () => {
        Iustina.dir = Kitty.x > Iustina.x ? 1 : -1; Iustina.state = 'crouch';
        let n = 0; const iv = setInterval(() => { particle('\u2728', Kitty.x + (Math.random() * 16 - 8), Kitty.y - 24, '#fff6a8'); if (++n >= 5) clearInterval(iv); }, 280);
        setTimeout(() => {
          Iustina.state = 'idle'; st.clean = clamp(st.clean + 25, 0, 100); st.happy = clamp(st.happy + 8, 0, 100);
          Kitty.freeze = 60; Kitty.setState('petted'); sound('purr'); bubble('So fluffy!', Kitty.x, Kitty.y - 36); addCoins(1); endTask();
        }, 1500);
      });
      break; }
    case 'treat':
      G.treats++;
      if (G.treats > 3) { st.happy = clamp(st.happy - 10, 0, 100); st.energy = clamp(st.energy - 5, 0, 100); bubble('Too many treats... blegh', Kitty.x, Kitty.y - 34); }
      else { st.hunger = clamp(st.hunger + 5, 0, 100); st.happy = clamp(st.happy + 8, 0, 100); bubble('Yum!', Kitty.x, Kitty.y - 34); particle('\u2665', Kitty.x, Kitty.y - 26, '#ff6f91'); sound('meow'); addCoins(1); }
      updateUI(); break;
    case 'sleep':
      if (Kitty.state === 'sleep') { Kitty.setState('idle'); bubble('Mrrp?', Kitty.x, Kitty.y - 34); }
      else if (Kitty.state !== 'held') { G.toy = null; G.bowl = null; Kitty.setState('sleep'); bubble('Nap time', Kitty.x, Kitty.y - 34); }
      break;
    case 'bed': {
      const btn = document.getElementById('bed-btn');
      if (G.inBed) { // get up
        G.inBed = false; Iustina.cb = null;
        if (Iustina.state === 'lie') { Iustina.state = 'idle'; Iustina.x = BED_X - 46; Iustina.dir = -1; }
        else if (Iustina.state === 'walk') Iustina.state = 'idle';
        if (['toBed', 'hop', 'cuddle'].includes(Kitty.state)) {
          Kitty.setState('idle'); Kitty.x = BED_X - 40; Kitty.y = GROUND + 4; Kitty.dir = -1; bubble('Mrrp!', Kitty.x, Kitty.y - 34);
        }
        endTask(); btn.textContent = 'Bed'; return;
      }
      if (!startTask()) return;
      G.inBed = true; G.toy = null; G.bowl = null; btn.textContent = 'Get Up';
      Iustina.goTo(BED_X - 46, () => {
        if (!G.inBed) return;
        Iustina.dir = 1; Iustina.state = 'lie'; Iustina.x = BED_X - 6;
        bubble('Nap time~', BED_X - 6, GROUND - 46);
        setTimeout(() => { if (G.inBed && Iustina.state === 'lie' && Kitty.state !== 'held') Kitty.setState('toBed'); }, 900);
      });
      break; }
    case 'hold': {
      if (Kitty.state === 'held') {
        Kitty.setState('idle'); Kitty.y = GROUND + 4; Iustina.crouchFor(400); bubble('Down you go', Iustina.x, Iustina.y - 50); return;
      }
      if (!startTask()) return;
      Kitty.setState('wait');
      Iustina.goTo(Kitty.x + sideOf(Kitty.x) * 20, () => {
        Iustina.dir = Kitty.x > Iustina.x ? 1 : -1;
        Iustina.crouchFor(450, () => { Kitty.setState('held'); particle('\u2665', Kitty.x, Kitty.y - 26, '#ff6f91'); sound('purr'); addCoins(1); endTask(); });
      });
      break; }
  }
  updateUI();
};

// ===== INPUT =====
canvas.addEventListener('pointerdown', e => {
  ac();
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (Math.abs(x - Kitty.x) < 18 && y > Kitty.y - 34 && y < Kitty.y + 6) { action('pet'); return; }
  if (y > 115 && !Iustina.busy) Iustina.goTo(x);
});

// ===== DRAW =====
function draw() {
  ctx.drawImage(bg, 0, 0);
  const light = (Math.sin(G.time * 2 * Math.PI / 240) + 1) / 2;
  // twinkling stars
  stars.forEach(s => { const a = (0.35 + 0.65 * Math.abs(Math.sin(G.time * 1.5 + s.p))) * (1 - light * 0.9);
    ctx.fillStyle = 'rgba(255,255,230,' + a + ')'; ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1); });
  // sky lightens during "day"
  ctx.fillStyle = 'rgba(130,180,235,' + (0.5 * light) + ')'; ctx.fillRect(0, 0, W, 118);
  // bed
  { const bx = BED_X;
    ctx.fillStyle = '#3a2a22'; ctx.fillRect(bx - 36, GROUND - 22, 4, 28);
    ctx.fillStyle = '#5a3a2a'; ctx.fillRect(bx - 34, GROUND - 2, 68, 8);
    ctx.fillStyle = '#d9d2e9'; ctx.fillRect(bx - 32, GROUND - 8, 64, 6);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(bx - 30, GROUND - 12, 16, 5);
    ctx.fillStyle = '#e8dfc9'; ctx.fillRect(bx - 30, GROUND - 12, 16, 1);
    if (!G.inBed) { ctx.fillStyle = '#8f6fb5'; ctx.fillRect(bx - 2, GROUND - 11, 34, 4); ctx.fillStyle = '#a98bd0'; ctx.fillRect(bx - 2, GROUND - 11, 34, 1); }
  }
  // props
  if (G.bowl) { const s = Sprites.bowl; ctx.drawImage(s, Math.floor(G.bowl.x - s.width / 2), GROUND + 4 - s.height); }
  if (G.toy) { const s = Sprites.toy; const bob = Math.abs(Math.sin(G.time * 6)) * 3; ctx.drawImage(s, Math.floor(G.toy.x - s.width / 2), Math.floor(GROUND + 4 - s.height - bob)); }
  // characters
  Iustina.draw();
  if (Iustina.state === 'lie') { // blanket over her legs
    ctx.fillStyle = '#8f6fb5'; ctx.fillRect(BED_X - 2, GROUND - 14, 34, 7);
    ctx.fillStyle = '#a98bd0'; ctx.fillRect(BED_X - 2, GROUND - 14, 34, 1);
  }
  Kitty.draw();
  // held cat draws on top of girl
  // particles
  ctx.font = 'bold 9px "Courier New",monospace'; ctx.textAlign = 'center';
  G.particles.forEach(p => { ctx.globalAlpha = clamp(p.life / 30, 0, 1); ctx.fillStyle = p.color; ctx.fillText(p.text, Math.floor(p.x), Math.floor(p.y)); });
  ctx.globalAlpha = 1;
  // speech bubbles
  ctx.font = 'bold 8px "Courier New",monospace';
  G.bubbles.forEach(b => {
    const w = Math.ceil(ctx.measureText(b.text).width) + 8, x = Math.floor(clamp(b.x - w / 2, 2, W - w - 2)), y = Math.floor(b.y);
    ctx.globalAlpha = clamp(b.life / 25, 0, 1);
    ctx.fillStyle = '#4a3028'; ctx.fillRect(x - 1, y - 1, w + 2, 13);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, 11);
    ctx.fillRect(x + 4, y + 11, 4, 3);
    ctx.fillStyle = '#4a3028'; ctx.textAlign = 'center'; ctx.fillText(b.text, x + w / 2, y + 8);
  });
  ctx.globalAlpha = 1;
  // night/day tint
  ctx.fillStyle = 'rgba(10,10,40,' + (0.28 * (1 - light)) + ')'; ctx.fillRect(0, 0, W, H);
}

// ===== LOOP =====
function update() {
  G.time += 1 / 60;
  Iustina.update(); Kitty.update();
  G.particles.forEach(p => { p.y -= 0.3; p.life--; }); G.particles = G.particles.filter(p => p.life > 0);
  G.bubbles.forEach(b => { b.y -= 0.1; b.life--; }); G.bubbles = G.bubbles.filter(b => b.life > 0);
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += now - last; last = now; if (acc > 250) acc = 250;
  while (acc >= 16.667) { update(); acc -= 16.667; }
  draw(); requestAnimationFrame(loop);
}
load();
bubble('Hi Kitty!', Iustina.x, Iustina.y - 50);
requestAnimationFrame(loop);
</script>
