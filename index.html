<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<title>Iustina & Kitty</title>
<style>
  :root { --bg:#14121a; --panel:#1f1c29; --panel2:#2a2636; --line:#3a3548; --text:#f1e8d8; --muted:#a79f90; --accent:#f0b35e; --ink:#2b1d12; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
               font-family:ui-monospace,'Courier New',monospace; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  button { font-family:inherit; }

  /* Page grid: top bar / stats / game / action dock */
  #app { height:100vh; height:100dvh; max-width:760px; margin:0 auto; display:grid;
         grid-template-rows:auto auto minmax(0,1fr) auto; grid-template-areas:"top" "stats" "stage" "dock";
         padding-top:env(safe-area-inset-top); }
  #top { grid-area:top; display:flex; align-items:center; gap:8px; padding:8px 10px; }
  #stats { grid-area:stats; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 10px 8px; }
  #stage { grid-area:stage; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden;
           background:linear-gradient(#25304c 50%,#1b3329 50%); }
  #dock  { grid-area:dock; background:var(--panel); border-top:1px solid var(--line);
           padding:6px 10px calc(10px + env(safe-area-inset-bottom)); }

  /* Cat switcher */
  .seg { display:flex; flex:1; min-width:0; gap:3px; padding:3px; background:var(--panel); border:1px solid var(--line); border-radius:12px; }
  .seg button { flex:1; min-width:0; border:0; border-radius:9px; background:transparent; color:var(--muted); font-weight:700; font-size:13px;
                padding:9px 6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .seg button.on { background:var(--accent); color:var(--ink); }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:0 10px; height:40px; display:flex; align-items:center;
          font-size:12px; font-weight:700; white-space:nowrap; }
  .icon { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:18px; cursor:pointer; }

  /* Stat bars */
  .stat { display:flex; align-items:center; gap:6px; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
  .stat .ic { font-size:13px; line-height:1; }
  .bar { flex:1; min-width:0; height:8px; background:#0c0b11; border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:100%; border-radius:99px; transition:width .3s; }

  canvas#c { display:block; width:100%; image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer; }

  /* Action dock */
  .dtabs { display:flex; gap:6px; margin-bottom:8px; }
  .dtabs button { flex:1; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-weight:700; font-size:12px;
                  letter-spacing:.08em; text-transform:uppercase; padding:8px 4px; cursor:pointer; }
  .dtabs button.on { color:var(--accent); border-bottom-color:var(--accent); }
  .dpanel { display:none; grid-template-columns:repeat(4,1fr); gap:8px; }
  .dpanel.on { display:grid; }
  .dpanel.wrap { grid-template-columns:repeat(5,1fr); gap:6px; }
  .act { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:62px; padding:8px 4px;
         background:var(--panel2); border:1px solid var(--line); border-radius:12px; color:var(--text); font-size:12px; font-weight:700; cursor:pointer; }
  .act .ic { font-size:20px; line-height:1; }
  .act:active { transform:scale(.96); background:#34304a; }
  .hint { margin-top:8px; text-align:center; color:var(--muted); font-size:11px; line-height:1.4; }

  /* Phones held sideways: game on the left, controls on the right */
  @media (orientation:landscape) and (max-height:560px) {
    #app { max-width:none; grid-template-columns:minmax(0,1fr) 310px; grid-template-rows:auto auto minmax(0,1fr);
           grid-template-areas:"stage top" "stage stats" "stage dock"; padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
    #top { padding:8px 10px 6px; }
    #stats { grid-template-columns:repeat(2,1fr); padding-bottom:6px; }
    #dock { border-top:0; padding-bottom:8px; overflow:auto; }
    .act { min-height:52px; }
    .hint { display:none; }
  }

  /* Outfit sheet */
  #house-panel { position:fixed; inset:0; background:rgba(8,6,14,.88); display:none; align-items:center; justify-content:center; z-index:30; padding:12px; }
  #house-panel.open { display:flex; }
  #house-panel .hp { width:100%; max-width:min(720px, 100%); display:flex; flex-direction:column; gap:10px; align-items:center; }
  #hc { width:100%; max-width:min(720px, calc((100dvh - 120px) * 1.6)); aspect-ratio:16/10; image-rendering:pixelated; border:3px solid #3b2a1e; border-radius:10px; background:#241a13; box-shadow:0 8px 30px rgba(0,0,0,.6); }
  #house-cap { font-size:13px; font-weight:700; color:var(--text); letter-spacing:.04em; }
  #house-close { min-height:44px; padding:0 22px; border:0; border-radius:12px; background:var(--accent); color:var(--ink); font-weight:800; font-size:14px; cursor:pointer; }
  #outfit-panel { position:fixed; inset:0; background:rgba(10,8,16,.8); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  #outfit-panel.open { display:flex; }
  #outfit-panel .op { width:100%; max-width:520px; max-height:92vh; max-height:92dvh; overflow:auto; background:var(--panel); border:1px solid var(--line);
                      border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width:600px) { #outfit-panel { align-items:center; } #outfit-panel .op { border-radius:18px; } }
  #outfit-panel h2 { margin:0 0 4px; font-size:18px; text-transform:uppercase; letter-spacing:.06em; }
  #outfit-panel p { margin:0 0 12px; font-size:12px; color:var(--muted); }
  .ocards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
  .ocard { background:var(--panel2); border:2px solid var(--line); border-radius:14px; padding:8px; text-align:center; cursor:pointer; }
  .ocard.on { border-color:var(--accent); }
  .ocard canvas { width:100%; height:auto; aspect-ratio:1/1; background:#2c2c5c; border-radius:8px; image-rendering:pixelated; display:block; }
  .ocard .lab { font-weight:700; font-size:13px; margin-top:8px; }
  #outfit-close { width:100%; min-height:48px; border:0; border-radius:12px; background:var(--accent); color:var(--ink); font-weight:800; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="seg">
      <button id="tab-kitty">Kitty</button>
      <button id="tab-ticky">Whatsapp</button>
    </div>
    <div class="chip">Lv <span id="bond">1</span>&nbsp;&middot;&nbsp;&#x1FA99; <span id="coins">0</span></div>
    <button class="icon" id="mute" aria-label="Sound on or off">&#x1F50A;</button>
  </div>

  <div id="stats">
    <div class="stat"><span class="ic">&#x1F356;</span><div class="bar"><div class="fill" id="b-hunger" style="background:#9cab4a"></div></div></div>
    <div class="stat"><span class="ic">&#x2764;&#xFE0F;</span><div class="bar"><div class="fill" id="b-happy" style="background:#e0606f"></div></div></div>
    <div class="stat"><span class="ic">&#x26A1;</span><div class="bar"><div class="fill" id="b-energy" style="background:#6f7ff0"></div></div></div>
    <div class="stat"><span class="ic">&#x2728;</span><div class="bar"><div class="fill" id="b-clean" style="background:#5fcde4"></div></div></div>
  </div>

  <div id="stage"><canvas id="c" width="320" height="180"></canvas></div>

  <div id="dock">
    <div class="dtabs">
      <button class="on" data-tab="care">Care</button>
      <button data-tab="play">Play</button>
      <button data-tab="rest">Rest</button>
    </div>
    <div class="dpanel on" id="p-care">
      <button class="act" onclick="action('feed')"><span class="ic">&#x1F356;</span>Feed</button>
      <button class="act" onclick="action('water')"><span class="ic">&#x1F4A7;</span>Water</button>
      <button class="act" onclick="action('treat')"><span class="ic">&#x1F36C;</span>Treat</button>
      <button class="act" onclick="action('brush')"><span class="ic">&#x1FAAE;</span>Brush</button>
    </div>
    <div class="dpanel wrap" id="p-play">
      <button class="act" onclick="action('play')"><span class="ic">&#x1F9F6;</span>Play</button>
      <button class="act" onclick="action('playboth')"><span class="ic">&#x1F43E;</span>Play both</button>
      <button class="act" onclick="action('pet')"><span class="ic">&#x1F90D;</span>Pet</button>
      <button class="act" onclick="action('kiss')"><span class="ic">&#x1F618;</span>Kiss</button>
      <button class="act" onclick="action('hold')"><span class="ic">&#x1F932;</span>Pick up</button>
    </div>
    <div class="dpanel" id="p-rest">
      <button class="act" onclick="action('sleep')"><span class="ic">&#x1F634;</span>Sleep</button>
      <button class="act" id="bed-btn" onclick="action('bed')"><span class="ic">&#x1F6CF;&#xFE0F;</span><span id="bed-label">Go home</span></button>
      <button class="act" onclick="action('smoke')"><span class="ic">&#x1F6AC;</span>Smoke</button>
      <button class="act" id="outfit-btn"><span class="ic">&#x1F457;</span>Outfit</button>
    </div>
    <div class="hint">Tap a cat to pet it, or tap the other cat to switch. The one you leave goes into Iustina's house. Tap the house to peek into her bedroom — the cats' basket is in there too.</div>
  </div>
</div>

<div id="house-panel">
  <div class="hp">
    <canvas id="hc" width="160" height="100"></canvas>
    <div id="house-cap">Napping</div>
    <button id="house-close">Close</button>
  </div>
</div>

<div id="outfit-panel">
  <div class="op">
    <h2>Outfits</h2>
    <p>Pick a look for Iustina. Her hair changes colour with the outfit.</p>
    <div class="ocards" id="ocards"></div>
    <button id="outfit-close">Close</button>
  </div>
</div>

<script>
// ===== SETUP =====
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 320, H = 180, GROUND = 150, BED_X = 262, HOUSE_X = 282; // the cats' basket is inside Iustina's house, so they use her front door
const G = { time: 0, frame: 0, coins: 0, muted: false, particles: [], bubbles: [], bowl: null, toy: null, treats: 0, inBed: false };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const bondLevel = () => Math.floor(G.coins / 10) + 1;
let ACTIVE = 'kitty';
const cat = () => CATS[ACTIVE];

// ===== AUDIO =====
let audioCtx = null;
function ac() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function sound(type, p = 1) {
  if (G.muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  const t = a.currentTime;
  if (type === 'kiss') {
    o.type = 'sine'; o.frequency.setValueAtTime(1100, t); o.frequency.exponentialRampToValueAtTime(380, t + 0.07);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.start(t); o.stop(t + 0.1);
    const o2 = a.createOscillator(), g2 = a.createGain(); o2.connect(g2); g2.connect(a.destination); o2.type = 'sine';
    o2.frequency.setValueAtTime(900, t + 0.1); o2.frequency.exponentialRampToValueAtTime(500, t + 0.15);
    g2.gain.setValueAtTime(0.0001, t + 0.1); g2.gain.linearRampToValueAtTime(0.1, t + 0.11); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.17); o2.start(t + 0.1); o2.stop(t + 0.18);
    return;
  }
  if (type === 'puff') {
    const len = Math.floor(a.sampleRate * 0.7), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / len);
    const n = a.createBufferSource(), lp = a.createBiquadFilter(), ng = a.createGain();
    n.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 1400; n.connect(lp); lp.connect(ng); ng.connect(a.destination);
    ng.gain.setValueAtTime(0.12, t); n.start(t);
    return;
  }
  if (type === 'flick') {
    o.type = 'square'; o.frequency.setValueAtTime(2400, t); o.frequency.setValueAtTime(1800, t + 0.03);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.start(t); o.stop(t + 0.1);
    return;
  }
  if (type === 'meow' || type === 'mew') {
    // two detuned voices through a vowel-like filter, with a little vibrato = "mee-ow"
    const long = type === 'meow', d = long ? 0.5 : 0.22;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(1800, t + d * 0.4); f.frequency.linearRampToValueAtTime(700, t + d);
    const o2 = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain();
    o.disconnect(); o.connect(f); o2.connect(f); f.connect(g);
    o.type = 'sawtooth'; o2.type = 'triangle';
    const base = 430 * p, peak = (long ? 900 : 760) * p, end = (long ? 360 : 520) * p;
    for (const x of [o, o2]) {
      x.frequency.setValueAtTime(base, t);
      x.frequency.exponentialRampToValueAtTime(peak, t + d * 0.35);
      x.frequency.exponentialRampToValueAtTime(end, t + d);
    }
    o2.detune.value = 12;
    lfo.frequency.value = 22; lg.gain.value = 14 * p; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32, t + d * 0.2); g.gain.linearRampToValueAtTime(0.2, t + d * 0.7); g.gain.linearRampToValueAtTime(0, t + d);
    o.start(t); o2.start(t); lfo.start(t); o.stop(t + d + 0.02); o2.stop(t + d + 0.02); lfo.stop(t + d + 0.02);
  } else if (type === 'purr') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(40, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.08, t + 0.1); g.gain.linearRampToValueAtTime(0, t + 1.0);
    o.start(t); o.stop(t + 1.05);
  } else if (type === 'eat') {
    o.type = 'square'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.06);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.start(t); o.stop(t + 0.08);
  } else if (type === 'coin') {
    o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.07);
    g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.2);
  } else {
    o.type = 'square'; o.frequency.setValueAtTime(800, t); o.frequency.exponentialRampToValueAtTime(200, t + 0.1);
    g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    o.start(t); o.stop(t + 0.11);
  }
}
$('mute').addEventListener('click', () => { G.muted = !G.muted; $('mute').textContent = G.muted ? '\u{1F507}' : '\u{1F50A}'; });

// ===== PIXEL SPRITES =====
// Kitty uses PAL; Ticky uses PAL2 (same shapes, tabby recolour).
const PAL = {
  S:'#f1c27d', H:'#9a4a2c', h:'#c46a3a', W:'#f4f1ee', J:'#8fb0dc', R:'#d95763', L:'#c0392b', T:'#999999', K:'#2b1d1a',
  C:'#e8cfa6', B:'#4a3028', E:'#5fcde4', D:'#d95763', F:'#c97b3d', O:'#1e1410', Q:'#8a5a3b', P:'#d8c3a5'
};
const PAL2 = Object.assign({}, PAL, { C:'#c9a57c', B:'#5b4331', E:'#8fbf6a', D:'#c9826b' });
const SC = 3;      // screen px per sprite cell (Iustina)
const CAT_SC = 2;  // screen px per sprite cell (cats)
const GIRL_HEAD = [
  ".....HHHHHH.....",

  "...HHSSSSSSHH...",
  "...HHSKSSKSHH...",
  "...HHSSSSSSHH...",

];
const SPR = {
  girl_idle: [...GIRL_HEAD,
    "...HWWWWWWWWH...",
    "..SHWWWWWWWWHS..",
    "..SWWWWWWWWWWS..",
    "..SWWWWWWWWWWT..",

    "....JJJJ.JJJ....",

    "...HWWWWWWWWH...",

    "...WWWWWWWWWW...",
    "....SSSSSSSS....",
    "....JJJJJJJJ....",
    "...JJJJ....JJJ..",
    "..JJJJ......JJJ.",
    "..JJJ........JJ.",
    "..RRR.......RRR."],
  girl_crouch: [
    "................","................","................",
    ...GIRL_HEAD,
    "...HWWWWWWWWH...",
    "..SHWWWWWWWWHS..",
    "..SWWWWWWWWWWS..",
    "...WWWWWWWWWW...",
    "..JJJJJJJJJJJJ..",
    "..JJJJJJJJJJJJ..",
    "..JJJJJJJJJJJJ..",
    "..RRR......RRR.."],
  girl_lie: [
    ".HHHH...................",
    "HHHSSHH.................",
    "HHSKSLHWWWWWWWWJJJJJJJ..",
    "HHSSSSHWWWWWWWWJJJJJJJRR",
    ".HHH..WWWWWWWWJJJJJJJ...",
    "......SSSSSS............"],
  cat_sit: [
    "..BB......BB..",
    "..BBB....BBB..",
    "..BBBBBBBBBB..",
    ".BBBBBBBBBBBB.",
    ".BBEBBBBBBEBB.",
    ".BBBBBBDBBBBB.",
    "..BBBBBBBBBB..",
    "...CCCCCCCC...",
    "..CCCCCCCCCC..",
    ".CCCCCCCCCCCC.",
    ".CCCCCCCCCCCC.",
    "..CCCCCCCCCC..",
    "..BBBB....BBBB"],
  cat_beg: [
    "..BB......BB..",

    "...CCCCCCCC...",
    ".BCCCCCCCCCCB.",
    "BBCCCCCCCCCCBB",
    "B.CCCCCCCCCC.B",
    "..CCCCCCCCCC..",
    "..BBBB....BBBB"],
  cat_walk1: [
    "B............B..B.",
    "BB..........BBBBBB",
    ".B.........BBBBEBB",
    ".BB.CCCCCCCBBBBBBD",
    "..BCCCCCCCCCCBBBB.",
    "..CCCCCCCCCCCCCC..",
    "..CCCCCCCCCCCCCC..",
    "..CCCCCCCCCCCCC...",
    "..BB.BB....BB.BB..",
    "..BB.BB....BB.BB.."],
  cat_walk2: [
    ".B...........B..B.",
    "BB..........BBBBBB",
    "BB.........BBBBEBB",
    ".B..CCCCCCCBBBBBBD",
    "..BCCCCCCCCCCBBBB.",
    "..CCCCCCCCCCCCCC..",
    "..CCCCCCCCCCCCCC..",
    "..CCCCCCCCCCCCC...",
    "...B.B.....B.B....",
    "..B..B.....B..B..."],
  cat_sleep: [
    "....BBBBBBBB....",
    "..BBCCCCCCCBB...",
    ".BCCCCCCCCCCCBB.",
    "BCCCCCCCCCCCCCCBB",
    "BBBBBBBBBBBBBBBBB"],
  house: [
    "........QQ........",
    "......QQQQQQ......",
    "....QQQQQQQQQQ....",
    "..QQQQQQQQQQQQQQ..",
    "QQQQQQQQQQQQQQQQQQ",
    "PPPPPPPPPPPPPPPPPP",
    "PPPPPPPPPPPPPPPPPP",
    "PPPPPPKKKKKKPPPPPP",
    "PPPPPPKKKKKKPPPPPP",
    "PPPPPPKKKKKKPPPPPP",
    "PPPPPPKKKKKKPPPPPP",
    "PPPPPPPPPPPPPPPPPP"],
  bowl: ["KKKKKKKK", "KFFFFFFK", ".KKKKKK."],
  toy: [".DDD.", "DDLDD", "DLDDD", "DDDLD", ".DDD."]
};

// Adds a 1-cell dark outline (plus transparent border) around a sprite grid.
function outlineRows(raw) {
  const W0 = Math.max(...raw.map(r => r.length));
  const pad = '.'.repeat(W0 + 2);
  const g = [pad, ...raw.map(r => '.' + r.padEnd(W0, '.') + '.'), pad];
  const Hh = g.length, Ww = W0 + 2;
  return g.map((row, y) => row.split('').map((ch, x) => {
    if (ch !== '.') return ch;
    const hit = [[0, 1], [0, -1], [1, 0], [-1, 0]].some(([dx, dy]) => {
      const yy = y + dy, xx = x + dx;
      return yy >= 0 && yy < Hh && xx >= 0 && xx < Ww && g[yy][xx] !== '.';
    });
    return hit ? 'O' : '.';
  }).join(''));
}
const Sprites = {};
function compileSprites(pal, prefix, filter, source = SPR) {
  for (const [name, raw] of Object.entries(source)) {
    if (filter && !filter(name)) continue;
    const sc = /^cat/.test(name) ? CAT_SC : SC;

// ===== CATS =====
// Accessories (collar bow, bell) in padded sprite-grid cells, used by Kitty and Ticky.
const ACC = {
  cat_sit: { bow: [[5, 8], [6, 8]], bell: [[8, 9]] },
  cat_beg: { bow: [[5, 8], [6, 8]], bell: [[8, 9]] },
  cat_walk1: { bow: [[11, 4], [11, 5]], bell: [[11, 6]] },
  cat_walk2: { bow: [[11, 4], [11, 5]], bell: [[11, 6]] }

function drawCat(pre, n, flip, x, y) {
  const s = Sprites[pre + n + (flip ? '_flip' : '')];
  const dx = Math.floor(x - s.width / 2), dy = Math.floor(y - s.height);
  ctx.drawImage(s, dx, dy);
  const a = ACC[n];
  if (a) {
    const Wc = s.width / CAT_SC;
    const cell = (c, r, col) => { const cc = flip ? Wc - 1 - c : c; ctx.fillStyle = col; ctx.fillRect(dx + cc * CAT_SC, dy + r * CAT_SC, CAT_SC, CAT_SC); };
    if (bondLevel() >= 2) a.bow.forEach(([c, r]) => cell(c, r, '#e8606c'));
    if (bondLevel() >= 3) a.bell.forEach(([c, r]) => cell(c, r, '#f4c430'));
  }

}
function nameTag(text, x, y) {
  ctx.font = 'bold 8px "Courier New",monospace'; ctx.textAlign = 'center';
  const w = Math.ceil(ctx.measureText(text).width) + 8;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(Math.floor(x - w / 2), Math.floor(y - 8), w, 10);
  ctx.fillStyle = '#fff'; ctx.fillText(text, Math.floor(x), Math.floor(y));
}

function makeCat(name, pre, x0, stats0) {
  return {
    name, pre, x: x0, y: GROUND + 4, dir: -1, state: 'idle', timer: 0, stateT: 0, freeze: 0, hopFromX: 0,
    stats: Object.assign({ hunger: 60, happy: 60, energy: 90, clean: 90 }, stats0),
    setState(s) { this.state = s; this.stateT = 0; },
    meow(short) { sound(short ? 'mew' : 'meow', this.pre ? 0.82 : 1.1); particle(short ? '\u266A' : 'Meow!', this.x + 6, this.y - 26, '#fff2c2'); },
    update() {
      this.timer++; this.stateT++;
      const st = this.stats;
      if (this.timer % 60 === 0) {
        st.hunger = clamp(st.hunger - 0.4, 0, 100);
        st.clean = clamp(st.clean - 0.1, 0, 100);
        st.happy = clamp(st.happy - (st.hunger < 20 ? 0.5 : 0.2), 0, 100);
        if (!['sleep', 'cuddle', 'house'].includes(this.state)) st.energy = clamp(st.energy - 0.25, 0, 100);
        updateUI(); save();
      }
      if (this.state === 'house') return;
      if (this.state === 'toHouse') {
        const dx = HOUSE_X - this.x;
        if (Math.abs(dx) > 2) { this.dir = dx > 0 ? 1 : -1; this.x += this.dir * 1.6; }
        else { this.x = HOUSE_X; this.setState('house'); }
        this.y = GROUND + 4; return;
      }
      if (this.state === 'outHouse') {
        this.dir = -1; this.x -= 1.2; this.y = GROUND + 4;
        if (this.x <= HOUSE_X - 34) this.setState('idle');
        return;
      }
      if (this.state === 'lift' || this.state === 'drop') {
        // scoop up / set down along a soft arc between the ground and her arms
        const up = this.state === 'lift', p = clamp(this.stateT / (up ? 24 : 20), 0, 1), e = p * p * (3 - 2 * p);
        const hx = Iustina.x + Iustina.dir * 6, hy = Iustina.y - 18, gx = this.liftX, gy = GROUND + 4;
        const k = up ? e : 1 - e;
        this.x = gx + (hx - gx) * k; this.y = gy + (hy - gy) * k - Math.sin(Math.PI * p) * 6;
        if (p >= 1) {
          if (up) { this.setState('held'); particle('\u2665', this.x, this.y - 26, '#ff6f91'); sound('purr'); addCoins(1); endTask(); }
          else { this.x = gx; this.y = gy; this.setState('idle'); }
        }
        return;
      }
      if (this.state === 'held') {
        this.x = Iustina.x + Iustina.dir * 6; this.y = Iustina.y - 18 + ((Math.floor(this.timer / 45) % 2) ? 1 : 0);
        if (this.timer % 60 === 0) st.happy = clamp(st.happy + 0.6, 0, 100);
        return;
      }
      this.y = GROUND + 4;
      if (this.state === 'wait') return;
      if (this.state === 'petted') { if (this.stateT > this.freeze) this.setState('idle'); return; }
      if (this.state === 'toBed') {
        const dx = (DOOR_X + 4) - this.x;
        if (Math.abs(dx) > 3) { this.dir = dx > 0 ? 1 : -1; this.x += this.dir * 1.6; }
        else { this.setState('cuddle'); sound('purr'); particle('\u2665', this.x, this.y - 40, '#ff6f91'); }
        return;
      }
      if (this.state === 'hop') {
        const t = Math.min(1, this.stateT / 40);
        this.dir = 1;
        this.x = this.hopFromX + (BED_X - 8 - this.hopFromX) * t;
        this.y = (GROUND + 4) + ((GROUND - 9) - (GROUND + 4)) * t - Math.sin(Math.PI * t) * 18;
        if (t >= 1) { this.setState('cuddle'); sound('purr'); particle('♥', this.x, this.y - 16, '#ff6f91'); bubble('Purr...', this.x, this.y - 36); }
        return;
      }
      if (this.state === 'cuddle') {
        this.x = DOOR_X; this.y = GROUND + 4;
        if (this.stateT % 60 === 0) {
          st.energy = clamp(st.energy + 3, 0, 100); st.happy = clamp(st.happy + 1, 0, 100); updateUI();
          const z = this.stateT % 120 === 0;
          if (z) particle('Zzz', IH_WIN.x + 14, IH_WIN.y - 4, '#cfd8ff');
          if (this.stateT % 240 === 0) sound('purr');

        return;
      }
      if (this.state === 'idle') {
        if (G.toy && st.energy > 8) { this.setState('walk'); return; }

        if (st.energy < 20) { this.setState('sleep'); return; }
        if (st.hunger < 30 && Math.random() < 0.006) { bubble('Feed me!', this.x, this.y - 34); sound('meow'); this.setState('beg'); return; }
        if (st.happy < 25 && Math.random() < 0.004) bubble('mrrp...', this.x, this.y - 34);
        if (Math.random() < 0.012) { this.dir = Math.random() < 0.5 ? 1 : -1; this.zoom = Math.random() < 0.25; this.setState('walk'); }
      }

        const target = G.toy || G.bowl;

          const dx = target.x - this.x;

        } else {

          if (this.zoom ? this.stateT > 80 : (this.x < 20 || this.x > W - 20 || this.stateT > 90 + Math.random() * 100)) { this.zoom = false; this.setState('idle'); }
        }
      }
      else if (this.state === 'eat') {
        if (!G.bowl) { this.setState('idle'); return; }
        if (this.stateT % 30 === 0) {
          st.hunger = clamp(st.hunger + 8, 0, 100); sound('eat'); updateUI();
          if (st.hunger >= 100 || this.stateT > 420) {
            G.bowl = null; this.setState('idle'); bubble('Purr...', this.x, this.y - 34); this.meow(true); sound('purr'); addCoins(1);
          }

      }
      else if (this.state === 'play') {
        if (!G.toy) { this.setState('idle'); return; }

        if (this.stateT % 15 === 0) {
          st.happy = clamp(st.happy + 2, 0, 100); st.energy = clamp(st.energy - 1.2, 0, 100); updateUI();
          if (this.stateT % 60 === 0) particle('♥', this.x, this.y - 30, '#d95763');
          if (this.stateT % 150 === 0 && this.stateT > 0) this.meow(true);
        }
        if (this.stateT > 600 || st.energy < 10) { G.toy = null; this.setState('idle'); bubble('Fun!', this.x, this.y - 34); addCoins(2); }
      }
      else if (this.state === 'sleep') {
        if (this.stateT % 60 === 0) {
          st.energy = clamp(st.energy + 4, 0, 100); particle('Zzz', this.x + 8, this.y - 16, '#cfd8ff'); updateUI();

    },
    draw() {
      if (this.state === 'house' || this.state === 'cuddle') return;
      let n = 'cat_sit', bob = 0;
      const flip = this.dir === -1;
      if (['walk', 'toBed', 'outHouse', 'toHouse'].includes(this.state)) {
        const run = G.toy || G.bowl || this.zoom || this.state === 'toBed';
        n = (Math.floor(this.timer / (run ? 5 : 8)) % 2) ? 'cat_walk1' : 'cat_walk2';
        bob = -Math.abs(Math.sin(this.timer / (run ? 2.6 : 4))) * (run ? 3 : 1.6);

      }
      else if (this.state === 'sleep') { n = 'cat_sleep'; bob = (Math.floor(this.timer / 35) % 2) ? 1 : 0; }
      else if (this.state === 'eat') bob = (Math.floor(this.timer / 10) % 2) ? 2 : 0;
      else if (this.state === 'play') { n = 'cat_beg'; bob = -Math.abs(Math.sin(this.timer / 6)) * 5; }
      else if (this.state === 'beg' || this.state === 'hop') n = 'cat_beg';
      else if (this.state === 'cuddle') { n = 'cat_sleep'; bob = (Math.floor(this.timer / 40) % 2) ? 1 : 0; }

      }

        ctx.fillStyle = '#1d1412'; ctx.fillRect(ax - 1, ay - 1, 26, 6);
        ctx.fillStyle = '#f1c27d'; ctx.fillRect(ax, ay, 24, 4);

        ctx.fillStyle = '#f7d9a4'; ctx.fillRect(ax + 2, ay, 7, 1);

const CATS = {
  kitty: makeCat('Kitty', '', 170, {}),
  ticky: makeCat('Whatsapp', 'b_', HOUSE_X, {})
};

// Puts the active cat outside and the others in Iustina's house.
function initCats() {
  for (const id of Object.keys(CATS)) {
    const c = CATS[id];
    if (id === ACTIVE) { c.setState('idle'); c.dir = -1; }
    else { c.x = HOUSE_X; c.setState('house'); }
  }
}

// Switches the active cat. The one leaving walks into Iustina's house.
function switchTo(id) {
  if (id === ACTIVE || !CATS[id]) return;
  if (G.inBed) { bubble('Come out first!', DOOR_X - 6, GROUND - 40); return; }
  if (Iustina.busy) return;
  const old = cat(), nu = CATS[id];
  if (old.state === 'held' || old.state === 'lift' || old.state === 'drop') { if (old.state === 'held') bubble('Put ' + old.name + ' down first', Iustina.x, Iustina.y - 90); return; }
  ACTIVE = id;
  old.setState('toHouse');
  if (nu.state === 'house' || nu.state === 'toHouse') { nu.x = HOUSE_X; nu.setState('outHouse'); }
  bubble('Hi ' + nu.name + '!', HOUSE_X - 30, GROUND - 40);
  updateUI(); save();
}

// ===== EFFECTS =====
function particle(text, x, y, color) { G.particles.push({ text, x, y, life: 70, color: color || '#fff' }); }
function bubble(text, x, y) { G.bubbles.push({ text, x, y, life: 110 }); }
function addCoins(n) {
  const before = bondLevel(); G.coins += n; sound('coin');
  if (bondLevel() > before) { bubble('Bond level up!', cat().x, cat().y - 44); particle('★', cat().x, cat().y - 30, '#f4c430'); }
  updateUI();
}
function updateUI() {
  const s = cat().stats;
  $('b-hunger').style.width = s.hunger + '%';
  $('b-happy').style.width = s.happy + '%';
  $('b-energy').style.width = s.energy + '%';
  $('b-clean').style.width = s.clean + '%';
  $('coins').textContent = G.coins;
  $('bond').textContent = bondLevel();
  $('tab-kitty').classList.toggle('on', ACTIVE === 'kitty');
  $('tab-ticky').classList.toggle('on', ACTIVE === 'ticky');
}
const SAVE_KEY = 'iustina_kitty_v3';
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ active: ACTIVE, kitty: CATS.kitty.stats, ticky: CATS.ticky.stats, coins: G.coins, treats: G.treats })); } catch (e) {}
}
function load() {
  try {
    let d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!d) { // migrate the older single-cat save
      const old = JSON.parse(localStorage.getItem('iustina_kitty_v2') || 'null');
      if (old) d = { kitty: old.stats, coins: old.coins, treats: old.treats };
    }
    if (d) {
      if (d.kitty) Object.assign(CATS.kitty.stats, d.kitty);
      if (d.ticky) Object.assign(CATS.ticky.stats, d.ticky);
      G.coins = d.coins || 0; G.treats = d.treats || 0;
      if (d.active && CATS[d.active]) ACTIVE = d.active;
    }
  } catch (e) {}
}

// ===== ACTIONS =====
function startTask() { if (Iustina.busy || ['held', 'lift', 'drop'].includes(cat().state)) return false; Iustina.busy = true; return true; }
function endTask() { Iustina.busy = false; }
function sideOf(x) { return Iustina.x <= x ? -1 : 1; }

window.action = function (type) {
  ac(); sound('click');
  const c = cat(), st = c.stats;
  if (c.state === 'lift' || c.state === 'drop') return;
  if (c.state === 'held' && type !== 'hold' && type !== 'pet' && type !== 'kiss') { bubble('Put ' + c.name + ' down first', Iustina.x, Iustina.y - 50); return; }
  if (G.inBed && type !== 'bed' && type !== 'pet') { bubble('Come out first!', DOOR_X - 6, GROUND - 40); return; }
  switch (type) {
    case 'feed': {
      if (st.hunger >= 95) { bubble('Not hungry', c.x, c.y - 34); return; }
      if (!startTask()) return;
      const bx = clamp(Math.round(100 + Math.random() * 180), 100, W - 40);
      Iustina.goTo(bx - 22, () => {
        Iustina.dir = 1;
        Iustina.crouchFor(700, () => {
          G.bowl = { x: bx };
          Object.values(CATS).forEach(k => { if (k.state === 'sleep') k.setState('idle'); });
          endTask();
        });
      });

  ctx.drawImage(bg, 0, 0);

  { const hg = ctx.createLinearGradient(0, 70, 0, 124); hg.addColorStop(0, 'rgba(150,195,240,0)'); hg.addColorStop(1, 'rgba(150,195,240,' + (0.42 * light) + ')'); ctx.fillStyle = hg; ctx.fillRect(0, 70, W, 54); } // daylight haze on the hills
  { // a cat napping in the basket indoors: little z's drift up above the front door

      ctx.globalAlpha = 1; } }

    const w = IH_WIN, asleep = G.inBed, inside = G.inBed || Iustina.hidden, night = 1 - daylight(localHour());

    if (lit && night > 0.3) { const gl = ctx.createRadialGradient(w.x + 16, w.y + 12, 1, w.x + 16, w.y + 12, 40); gl.addColorStop(0, 'rgba(255,210,120,' + (0.32 * night) + ')'); gl.addColorStop(1, 'rgba(255,210,120,0)'); ctx.fillStyle = gl; ctx.fillRect(w.x - 40, w.y - 40, w.w + 80, w.h + 80); }

  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(10,10,40,' + (0.28 * (1 - light)) + ')'; ctx.fillRect(0, 0, W, H);
}

// ===== LOOP =====
function update() {
  G.time += 1 / 60; G.frame++;
  if (G.frame % 3600 === 0 && G.treats > 0) G.treats--;
  Iustina.update(); CATS.kitty.update(); CATS.ticky.update();
  G.particles.forEach(p => { p.y -= 0.3; p.life--; }); G.particles = G.particles.filter(p => p.life > 0);
  G.bubbles.forEach(b => { b.y -= 0.1; b.life--; }); G.bubbles = G.bubbles.filter(b => b.life > 0);
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += now - last; last = now; if (acc > 250) acc = 250;
  while (acc >= 16.667) { update(); acc -= 16.667; }
  draw(); requestAnimationFrame(loop);
}

    const t = ctx.getImageData(2, 1, 1, 1).data, bt = ctx.getImageData(2, H - 2, 1, 1).data;
    const css = 'linear-gradient(rgb(' + t[0] + ',' + t[1] + ',' + t[2] + ') 50%,rgb(' + bt[0] + ',' + bt[1] + ',' + bt[2] + ') 50%)';
    if (css !== lastEdge) { $('stage').style.background = css; lastEdge = css; }
  } catch (e) {}
}, 1000);

// ===== LAYOUT: keep the 16:9 game as large as the screen allows =====
function fitCanvas() {
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  let cw = Math.min(w, h * 16 / 9);
  if (cw >= 640) cw = Math.floor(cw / 320) * 320; // whole-number scale on big screens keeps pixels crisp
  canvas.style.width = Math.floor(cw) + 'px';
  canvas.style.height = Math.floor(cw * 9 / 16) + 'px';
}
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe($('stage'));
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ===== ACTION DOCK TABS =====
document.querySelectorAll('.dtabs button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.dtabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.dpanel').forEach(pn => pn.classList.toggle('on', pn.id === 'p-' + b.dataset.tab));
}));

requestAnimationFrame(loop);
</script>
</body>
</html>
